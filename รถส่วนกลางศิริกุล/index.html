<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รถส่วนกลางศิริกุล</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --ink:#1f2937; --mute:#6b7280; --pri:#1a56db; --bad:#b91c1c; --warn:#b45309; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Sarabun","Noto Sans Thai",system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:16px; padding-bottom:72px; }
  header { background:var(--pri); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:18px; }
  header small { opacity:.85; }
  main { padding:12px 16px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  h2 { font-size:16px; margin:0 0 10px; }
  label { display:block; font-size:14px; color:var(--mute); margin:10px 0 4px; }
  input, select, textarea { width:100%; padding:11px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:#fff; font-family:inherit; }
  button { font-family:inherit; font-size:16px; border:0; border-radius:10px; padding:12px 16px; background:var(--pri); color:#fff; width:100%; margin-top:14px; }
  button:disabled { opacity:.5; }
  button.ghost { background:#e5e7eb; color:var(--ink); }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:1px solid var(--line); z-index:5; }
  nav button { flex:1; margin:0; border-radius:0; background:#fff; color:var(--mute); padding:12px 4px; font-size:13px; }
  nav button.on { color:var(--pri); font-weight:700; }
  .alert { padding:8px 10px; border-radius:8px; margin-bottom:6px; font-size:14px; background:#fef3c7; color:var(--warn); }
  .alert.bad { background:#fee2e2; color:var(--bad); }
  .row { border-bottom:1px solid var(--line); padding:8px 0; font-size:14px; }
  .row:last-child { border:0; }
  .row b { font-size:15px; }
  .mute { color:var(--mute); }
  .thumbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .thumbs img { width:64px; height:64px; object-fit:cover; border-radius:6px; }
  #msg { position:fixed; left:16px; right:16px; bottom:76px; padding:12px; border-radius:10px; color:#fff; display:none; z-index:9; text-align:center; }
  #msg.ok { background:#047857; } #msg.err { background:var(--bad); }
  .hide { display:none; }
  .center { text-align:center; padding:40px 16px; }
</style>
</head>
<body>
<header><h1>รถส่วนกลางศิริกุล</h1><small id="who">กำลังโหลด...</small></header>
<main id="app"><div class="center mute">กำลังโหลด...</div></main>
<div id="msg"></div>
<nav id="nav" class="hide">
  <button data-t="home" class="on">หน้าแรก</button>
  <button data-t="usage">ใช้รถ</button>
  <button data-t="expense">ค่าใช้จ่าย</button>
  <button data-t="cars" id="navCars" class="hide">รถ</button>
</nav>

<script>
var S = { me:null, cars:[], types:[], alerts:[], usage:[], expenses:[], tab:'home', busy:false };
var $ = function (s) { return document.querySelector(s); };

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
// 2026-11-19 -> 19/11/2569
function thDate(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  return m ? m[3] + '/' + m[2] + '/' + (Number(m[1]) + 543) : '-';
}
function today() {
  var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function baht(n) { return Number(n).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function toast(text, kind) {
  var m = $('#msg'); m.textContent = text; m.className = kind; m.style.display = 'block';
  setTimeout(function () { m.style.display = 'none'; }, 3500);
}
function call(action, payload) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) { r && r.ok ? resolve(r.data) : reject(new Error(r ? r.error : 'ไม่มีการตอบกลับ')); })
      .withFailureHandler(function (e) { reject(new Error(e.message || String(e))); })
      .api(action, payload);
  });
}
function isMgr() { return S.me && (S.me.role === 'manager' || S.me.role === 'admin'); }

/* ย่อรูปบนมือถือก่อนอัปโหลด */
function shrink(file) {
  return new Promise(function (resolve, reject) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var max = 1800, r = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { reject(new Error('เปิดรูปไม่ได้')); };
    img.src = url;
  });
}

function carOptions() {
  return S.cars.map(function (c) { return '<option value="' + esc(c.plate) + '">' + esc(c.plate) + ' ' + esc(c.model) + '</option>'; }).join('');
}

/* ---------- หน้าจอ ---------- */
function render() {
  var h = '';
  if (S.tab === 'home') h = viewHome();
  else if (S.tab === 'usage') h = viewUsage();
  else if (S.tab === 'expense') h = viewExpense();
  else if (S.tab === 'cars') h = viewCars();
  $('#app').innerHTML = h;
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === S.tab); });
  bindForms();
}

function viewHome() {
  var h = '';
  if (isMgr() && S.alerts.length) {
    h += '<div class="card"><h2>แจ้งเตือนวันหมดอายุ</h2>' + S.alerts.map(function (a) {
      return '<div class="alert ' + (a.expired ? 'bad' : '') + '">' + esc(a.plate) + ' · ' + esc(a.what) + ' ' +
        (a.expired ? 'หมดอายุแล้ว ' : 'หมดอายุ ') + thDate(a.date) + '</div>';
    }).join('') + '</div>';
  }
  h += '<div class="card"><h2>การใช้รถล่าสุด</h2>' + (S.usage.length ? S.usage.map(function (u) {
    var km = u.odoEnd !== '' ? (u.odoEnd - u.odoStart) + ' กม.' : 'ยังไม่ระบุไมล์หลัง';
    return '<div class="row"><b>' + esc(u.plate) + '</b> · ' + esc(u.name) + '<br>' + esc(u.purpose) +
      '<br><span class="mute">' + esc(String(u.ts).slice(0, 16)) + ' · ' + km + '</span>' + links(u.images) + '</div>';
  }).join('') : '<div class="mute">ยังไม่มีรายการ</div>') + '</div>';
  h += '<div class="card"><h2>ค่าใช้จ่ายล่าสุด</h2>' + (S.expenses.length ? S.expenses.map(function (e) {
    return '<div class="row"><b>' + esc(e.plate) + '</b> · ' + esc(e.type) + ' · ' + baht(e.amount) + ' บาท<br>' +
      '<span class="mute">' + thDate(e.date) + ' · ' + esc(e.name) + (e.note ? ' · ' + esc(e.note) : '') + '</span>' + links(e.images) + '</div>';
  }).join('') : '<div class="mute">ยังไม่มีรายการ</div>') + '</div>';
  return h;
}
function links(s) {
  if (!s) return '';
  return '<div>' + String(s).split('\n').map(function (u, i) {
    return /^https:\/\/(drive|docs)\.google\.com\//.test(u) ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">รูป ' + (i + 1) + '</a> ' : '';
  }).join('') + '</div>';
}

function imageField() {
  return '<label>แนบรูป (ถ่ายหรือเลือกจากเครื่อง ไม่เกิน 5 รูป)</label>' +
    '<input type="file" id="imgs" accept="image/*" multiple><div class="thumbs" id="thumbs"></div>';
}

function viewUsage() {
  if (!S.cars.length) return '<div class="card">ยังไม่มีรถในระบบ ให้แอดมินเพิ่มในแท็บ "รถ"</div>';
  return '<form class="card" id="fUsage"><h2>บันทึกการใช้รถ</h2>' +
    '<label>ทะเบียนรถ</label><select name="plate">' + carOptions() + '</select>' +
    '<label>เลขไมล์ก่อนออกเดินทาง</label><input name="odoStart" type="number" inputmode="numeric" min="0" required>' +
    '<label>เลขไมล์หลังกลับ (ถ้ายังไม่กลับ เว้นว่างได้)</label><input name="odoEnd" type="number" inputmode="numeric" min="0">' +
    '<label>วัตถุประสงค์ / ปลายทาง</label><textarea name="purpose" rows="2" maxlength="200" required></textarea>' +
    imageField() + '<button type="submit">บันทึก</button></form>';
}

function viewExpense() {
  if (!S.cars.length) return '<div class="card">ยังไม่มีรถในระบบ ให้แอดมินเพิ่มในแท็บ "รถ"</div>';
  return '<form class="card" id="fExpense"><h2>บันทึกค่าใช้จ่าย</h2>' +
    '<label>ทะเบียนรถ</label><select name="plate">' + carOptions() + '</select>' +
    '<label>วันที่</label><input name="date" type="date" value="' + today() + '" required>' +
    '<label>ประเภท</label><select name="type">' + S.types.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select>' +
    '<label>จำนวนเงิน (บาท)</label><input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required>' +
    '<label>หมายเหตุ</label><input name="note" maxlength="300">' +
    imageField() + '<button type="submit">บันทึก</button></form>';
}

function viewCars() {
  var h = '<div class="card"><h2>รถทั้งหมด</h2>' + (S.cars.length ? S.cars.map(function (c) {
    return '<div class="row"><b>' + esc(c.plate) + '</b> ' + esc(c.model) + ' ' + esc(c.year) +
      '<br><span class="mute">พ.ร.บ. ' + thDate(c.actExp) + ' · ภาษี ' + thDate(c.taxExp) + ' · ประกัน ' + thDate(c.insExp) + '</span></div>';
  }).join('') : '<div class="mute">ยังไม่มีรถ</div>') + '</div>';
  if (S.me.role === 'admin') {
    h += '<form class="card" id="fCar"><h2>เพิ่ม/แก้ไขรถ (ทะเบียนซ้ำ = แก้ไข)</h2>' +
      '<label>ทะเบียน</label><input name="plate" required maxlength="20">' +
      '<label>ยี่ห้อ/รุ่น</label><input name="model" maxlength="80">' +
      '<label>ปี</label><input name="year" inputmode="numeric" maxlength="4">' +
      '<label>พ.ร.บ.หมดอายุ</label><input name="actExp" type="date">' +
      '<label>ภาษีหมดอายุ</label><input name="taxExp" type="date">' +
      '<label>ประกันหมดอายุ</label><input name="insExp" type="date">' +
      '<label>สถานะ</label><select name="active"><option value="Y">ใช้งาน</option><option value="N">เลิกใช้</option></select>' +
      '<button type="submit">บันทึกรถ</button></form>';
  }
  return h;
}

/* ---------- ฟอร์ม ---------- */
var pendingImages = [];
function bindForms() {
  pendingImages = [];
  var inp = $('#imgs');
  if (inp) inp.addEventListener('change', async function () {
    var files = Array.prototype.slice.call(inp.files, 0, 5);
    if (inp.files.length > 5) toast('เลือกได้ไม่เกิน 5 รูป ใช้ 5 รูปแรก', 'err');
    try {
      pendingImages = await Promise.all(files.map(shrink));
      $('#thumbs').innerHTML = pendingImages.map(function (d) { return '<img src="' + d + '">'; }).join('');
    } catch (e) { toast(e.message, 'err'); }
  });
  hook('#fUsage', 'addUsage', function (d) { return { plate: d.plate, odoStart: d.odoStart, odoEnd: d.odoEnd, purpose: d.purpose, images: pendingImages }; });
  hook('#fExpense', 'addExpense', function (d) { return { plate: d.plate, date: d.date, type: d.type, amount: d.amount, note: d.note, images: pendingImages }; });
  hook('#fCar', 'saveCar', function (d) { return d; });
}
function hook(sel, action, build) {
  var f = $(sel); if (!f) return;
  f.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (S.busy) return;
    var btn = f.querySelector('button'); S.busy = true; btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    try {
      var d = {}; new FormData(f).forEach(function (v, k) { d[k] = v; });
      await call(action, build(d));
      toast('บันทึกเรียบร้อย', 'ok');
      await load(); S.tab = action === 'saveCar' ? 'cars' : 'home'; render();
    } catch (e) { toast(e.message, 'err'); btn.disabled = false; btn.textContent = 'บันทึก'; }
    S.busy = false;
  });
}

async function load() {
  var d = await call('bootstrap');
  S.me = d.me; S.cars = d.cars; S.types = d.expenseTypes; S.alerts = d.alerts; S.usage = d.recentUsage; S.expenses = d.recentExpenses;
  $('#who').textContent = S.me.name + ' (' + S.me.role + ')';
  $('#nav').classList.remove('hide');
  $('#navCars').classList.toggle('hide', !isMgr());
}

document.querySelectorAll('nav button').forEach(function (b) {
  b.addEventListener('click', function () { S.tab = b.dataset.t; render(); window.scrollTo(0, 0); });
});
load().then(render).catch(function (e) {
  $('#who').textContent = '';
  $('#app').innerHTML = '<div class="card"><h2>เข้าใช้งานไม่ได้</h2>' + esc(e.message) + '</div>';
});
</script>
</body>
</html>
