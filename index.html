<!-- ระบบรถส่วนกลางศิริกุล: หน้าเว็บอยู่บน GitHub Pages ข้อมูลอยู่ใน Google Sheets / Drive ของสำนักงาน -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&family=Noto+Sans+Thai+Looped:wght@500;600;700&family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
  (function () {
    var t = null, pl = null;
    try { t = localStorage.getItem('theme'); pl = localStorage.getItem('palette'); } catch (e) {}
    if (pl && /^[a-z]+$/.test(pl)) document.documentElement.setAttribute('data-palette', pl);
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="app.css?v=20261125i">
</head>
<body>
<header>
  <div class="hleft" id="hLeft"></div>
  <div class="hright">
    <button class="iconbtn hide" id="fsBtn" aria-label="เต็มจอ" title="เต็มจอ"></button>
    <button class="iconbtn" id="palBtn" aria-label="เลือกสีธีม" title="เลือกสีธีม"></button>
    <button class="iconbtn" id="themeBtn" aria-label="สลับโหมดมืด/ปกติ" title="สลับโหมดมืด/ปกติ"></button>
  </div>
</header>
<main id="app"><div class="center mute">กำลังโหลด...</div></main>
<div id="msg"></div>
<div id="modal"><div class="box"><div id="modalBody"></div><button class="ghost" id="modalClose">ปิด</button></div></div>
<nav id="nav" class="hide">

</nav>
